[project]
name = "sms-spam-mlops"
version = "0.1.0"
description = "End-to-end MLOps SMS spam classifier"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"fastapi==0.115.6",
	"joblib==1.4.2",
	"numpy==2.2.1",
	"pandas==2.2.3",
	"prometheus-client==0.21.1",
	"pydantic-settings==2.7.1",
	"scikit-learn==1.6.1",
	"uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
	"httpx==0.28.1",
	"pytest==8.3.4",
	"ruff==0.9.2",
]

[project.scripts]
download-data = "sms_spam_mlops.data.download_data:main"
train-model = "sms_spam_mlops.models.train:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
