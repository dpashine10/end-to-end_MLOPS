services:
  api:
    build:
      context: .
    environment:
      SMS_CORS_ORIGINS: ${SMS_CORS_ORIGINS:-http://localhost:8080}
      SMS_MIN_ACCEPTED_F1: ${SMS_MIN_ACCEPTED_F1:-0.80}
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; health = json.load(urllib.request.urlopen('http://localhost:8000/health')); raise SystemExit(0 if health.get('model_loaded') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes: ["./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
    depends_on: {api: {condition: service_healthy}}
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-me-before-deploy}"
    volumes: ["grafana-data:/var/lib/grafana", "./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro", "./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro"]
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    depends_on: [prometheus]
volumes:
  prometheus-data:
  grafana-data:
