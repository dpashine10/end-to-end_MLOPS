name: Train and evaluate
on:
  workflow_dispatch:
  schedule: [{cron: '0 4 1 * *'}]
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python -m sms_spam_mlops.data.download_data
        env: {PYTHONPATH: src}
      - run: python -m sms_spam_mlops.models.train
        env: {PYTHONPATH: src}
      - uses: actions/upload-artifact@v4
        with: {name: model-evaluation, path: reports/latest_evaluation.json}